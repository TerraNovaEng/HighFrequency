<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 1000 German Words | German Hub</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
            --tag-bg: #e0e7ff;
            --tag-text: #3730a3;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { margin-top: 0; color: var(--primary); text-align: center; }
        #search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            margin-bottom: 25px;
            box-sizing: border-box;
            outline: none;
        }
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 15px;
        }
        .word-card {
            background: #fafafa;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .rank { font-size: 0.8rem; color: #6b7280; font-weight: 600; }
        .pos { font-size: 0.75rem; background: var(--tag-bg); color: var(--tag-text); padding: 2px 8px; border-radius: 12px; }
        .german-word { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
        .translation { font-size: 0.95rem; color: #4b5563; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇩🇪 Top 1000 German Words</h1>
        <input type="text" id="search-box" placeholder="Search word..." onkeyup="filterWords()">
        <div class="word-grid" id="word-grid"></div>
    </div>

   </script> <!-- Close the inline script -->

    <script src="./words.js?v=2"></script> <!-- Load your external file -->

    <script>

        function renderWords(items) {
            const grid = document.getElementById('word-grid');
            grid.innerHTML = items.map(w => `
                <div class="word-card">
                    <div class="card-header">
                        <span class="rank">#${w.rank}</span>
                        <span class="pos">${w.pos}</span>
                    </div>
                    <div class="german-word">${w.de}</div>
                    <div class="translation">${w.en}</div>
                </div>
            `).join('');
        }

        function filterWords() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const filtered = words.filter(w => 
                w.de.toLowerCase().includes(query) || 
                w.en.toLowerCase().includes(query)
            );
            renderWords(filtered);
        }

        renderWords(words);
    </script>
</body>
</html>
